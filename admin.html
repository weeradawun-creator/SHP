<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>รายการสั่งซื้อ | sapoom</title>
  <link rel="stylesheet" href="style.css">

  <style>
    /* Page-specific styles for admin.html */
    .table-wrap {
      overflow-x: auto;
      background: var(--white);
      border: 1px solid var(--line-soft);
      border-radius: var(--radius);
    }

    #ordersTable {
      width: 100%;
      min-width: 760px;
      border-collapse: collapse;
      font-size: 0.95rem;
    }

    #ordersTable th,
    #ordersTable td {
      padding: var(--space-2) var(--space-3);
      text-align: left;
      vertical-align: top;
      line-height: 1.7;
    }

    #ordersTable thead th {
      font-weight: 400;
      font-size: var(--fs-sm);
      letter-spacing: 0.04em;
      white-space: nowrap;
      color: var(--ink);
      background: var(--cream-deep);
      border-bottom: 1px solid var(--line);
    }

    #ordersTable tbody td {
      color: var(--ink-soft);
      border-bottom: 1px solid var(--line-soft);
    }

    #ordersTable tbody tr:last-child td { border-bottom: 0; }
    #ordersTable tbody tr:hover td { background: var(--cream); }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container site-header__inner">
      <a class="brand" href="index.html">sapoom</a>
      <nav class="nav" aria-label="เมนูหลัก">
        <a href="index.html">หน้าแรก</a>
        <a href="product.html">สินค้า</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container">
        <div class="section__head">
          <h1>รายการสั่งซื้อ</h1>
          <hr class="rule">
          <p>เรียงจากรายการล่าสุดขึ้นก่อน</p>
        </div>

        <div class="table-wrap">
          <table id="ordersTable">
            <thead>
              <tr>
                <th scope="col">วันเวลา</th>
                <th scope="col">ชื่อลูกค้า</th>
                <th scope="col">เบอร์โทร/Line</th>
                <th scope="col">รายการสินค้า</th>
                <th scope="col">จำนวนเงินรวม</th>
                <th scope="col">หมายเหตุ</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container site-footer__inner">
      <span>&copy; 2026 sapoom</span>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
